name: Capture auction snapshot

on:
  # 自动采集由已稳定启动的上午盘中会话调用；手动入口只负责当日恢复。
  workflow_call:
    inputs:
      scheduled_clock:
        description: "调用方计划启动时间（北京时间 HH:MM:SS）"
        required: false
        default: "06:15:00"
        type: string
      wait_for_auction:
        description: "提前会话是否等待到竞价窗口"
        required: false
        default: true
        type: boolean
    secrets:
      BIYING_TOKEN:
        required: true
      BIYING_BASE_URL:
        required: false
  workflow_dispatch:
    inputs:
      scheduled_clock:
        description: "计划启动时间（北京时间 HH:MM:SS）"
        required: false
        default: "06:11:00"
        type: string
      wait_for_auction:
        description: "是否等待到竞价窗口"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  # 手动兜底与可复用任务共用竞价通道，已有会话运行时不并发重复采集。
  group: auction-prefetch-session
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Record runner timing
        id: runtime
        env:
          SCHEDULED_CLOCK: ${{ inputs.scheduled_clock || '' }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          now = dt.datetime.now(ZoneInfo("Asia/Shanghai"))
          scheduled_clock = os.environ.get("SCHEDULED_CLOCK", "") or now.strftime("%H:%M:%S")
          scheduled_slot = f"{now:%Y-%m-%d} {scheduled_clock}"
          runner_started_at = now.strftime("%Y-%m-%d %H:%M:%S")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"scheduled_slot={scheduled_slot}\n")
              fh.write(f"runner_started_at={runner_started_at}\n")
          print(f"scheduled_slot={scheduled_slot} runner_started_at={runner_started_at}")
          PY

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve trade date
        id: trade
        env:
          BIYING_TOKEN: ${{ secrets.BIYING_TOKEN }}
          BIYING_BASE_URL: ${{ secrets.BIYING_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${BIYING_TOKEN}" || { echo "Missing secrets.BIYING_TOKEN"; exit 2; }
          PYTHONPATH=. python3 - <<'PY'
          import datetime as dt
          import os
          from daily_review.config import load_config_from_env
          from daily_review.data.biying import resolve_trade_date_intraday
          from daily_review.http import HttpClient

          today = dt.datetime.now().strftime("%Y-%m-%d")
          cfg = load_config_from_env()
          client = HttpClient(base_url=cfg.base_url, token=cfg.token, timeout=20, retries=1)
          resolved, note = resolve_trade_date_intraday(client, today)
          print(f"auction_trade_date={resolved} requested={today} {note}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"date10={resolved}\n")
              fh.write(f"is_trade_today={'true' if resolved == today else 'false'}\n")
          PY

      - name: Checkout published cache
        if: ${{ steps.trade.outputs.is_trade_today == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site_prev
          fetch-depth: 1
          persist-credentials: true

      - name: Restore auction cache
        if: ${{ steps.trade.outputs.is_trade_today == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p cache site_prev/cache
          cp -f site_prev/cache/stock_research_backtest_source.json cache/ 2>/dev/null || true
          cp -f site_prev/cache/stock_research_realtime_quotes-*.json cache/ 2>/dev/null || true
          cp -f site_prev/cache/trade_days_cache.json cache/ 2>/dev/null || true

      - name: Check existing auction outcome
        id: existing
        if: ${{ steps.trade.outputs.is_trade_today == 'true' }}
        env:
          RUN_DATE: ${{ steps.trade.outputs.date10 }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import os
          from pathlib import Path
          from daily_review.application.workflow_schedule import (
              describe_auction_snapshot_status,
              resolve_auction_snapshot_prefetch_plan,
          )

          cache_dir = Path("site_prev/cache")
          plan = resolve_auction_snapshot_prefetch_plan(cache_dir, os.environ["RUN_DATE"])
          status = describe_auction_snapshot_status(cache_dir, os.environ["RUN_DATE"])
          ready = plan["status"] == "auction_snapshot_ready_skip" or status.get("status") == "recovered"
          print(f"existing_auction_ready={ready} plan={plan} status={status}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Mark preparation complete
        id: prepared
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && steps.existing.outputs.ready != 'true' }}
        run: echo "prepared_at=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Wait until final cache refresh
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && steps.existing.outputs.ready != 'true' && inputs.wait_for_auction == true }}
        run: |
          set -euo pipefail
          wait_seconds="$(python3 - <<'PY'
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone(timedelta(hours=8)))
          target = now.replace(hour=9, minute=24, second=30, microsecond=0)
          print(max(0, int((target - now).total_seconds())))
          PY
          )"
          if [ "${wait_seconds}" -gt 0 ]; then
            echo "Preparation complete; waiting ${wait_seconds}s for 09:24:30 cache refresh"
            sleep "${wait_seconds}"
          fi

      - name: Refresh published cache before capture
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && steps.existing.outputs.ready != 'true' }}
        run: |
          set -euo pipefail
          git -C site_prev fetch origin gh-pages
          git -C site_prev reset --hard origin/gh-pages
          cp -f site_prev/cache/stock_research_backtest_source.json cache/ 2>/dev/null || true
          cp -f site_prev/cache/stock_research_realtime_quotes-*.json cache/ 2>/dev/null || true
          cp -f site_prev/cache/trade_days_cache.json cache/ 2>/dev/null || true

      - name: Capture 09:25 auction quotes
        id: capture
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && steps.existing.outputs.ready != 'true' }}
        env:
          BIYING_TOKEN: ${{ secrets.BIYING_TOKEN }}
          BIYING_BASE_URL: ${{ secrets.BIYING_BASE_URL }}
          RUN_DATE: ${{ steps.trade.outputs.date10 }}
          SCHEDULED_SLOT: ${{ steps.runtime.outputs.scheduled_slot }}
          RUNNER_STARTED_AT: ${{ steps.runtime.outputs.runner_started_at }}
          PREPARED_AT: ${{ steps.prepared.outputs.prepared_at }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from daily_review.application.workflow_schedule import (
              execute_auction_snapshot_prefetch_until_deadline,
              write_auction_snapshot_status,
          )

          started_at = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          try:
              result = execute_auction_snapshot_prefetch_until_deadline(
                  cache_dir=Path("cache"),
                  trade_date10=os.environ["RUN_DATE"],
                  recover_outside_window=True,
              )
          except Exception as exc:
              # 状态文件必须先落地，未捕获异常也不能让页面继续伪装成等待中。
              result = {
                  "ok": False,
                  "reason": "auction_capture_exception",
                  "last_error": f"{type(exc).__name__}: {exc}",
                  "started_at": started_at,
                  "finished_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "session_rounds": 0,
                  "session_attempts": 0,
                  "codes_count": 0,
              }
          result.update({
              "scheduled_slot": os.environ.get("SCHEDULED_SLOT", ""),
              "runner_started_at": os.environ.get("RUNNER_STARTED_AT", ""),
              "prepared_at": os.environ.get("PREPARED_AT", ""),
              "workflow_run_id": os.environ.get("WORKFLOW_RUN_ID", ""),
          })
          status_path = write_auction_snapshot_status(
              cache_dir=Path("cache"),
              trade_date10=os.environ["RUN_DATE"],
              capture_result=result,
          )
          print("auction_prefetch_result=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          print(f"auction_status_path={status_path}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ok={'true' if result.get('ok') else 'false'}\n")
              fh.write(f"reason={result.get('reason') or ''}\n")
          PY

      - name: Publish auction cache and status
        id: publish
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && steps.existing.outputs.ready != 'true' && always() }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          remote_auction_check() {
            RUN_DATE="${{ steps.trade.outputs.date10 }}" PYTHONPATH=. python3 - <<'PY'
          import os
          from pathlib import Path
          from daily_review.application.workflow_schedule import (
              describe_auction_snapshot_status,
              resolve_auction_snapshot_prefetch_plan,
          )

          plan = resolve_auction_snapshot_prefetch_plan(Path("site_prev/cache"), os.environ["RUN_DATE"])
          status = describe_auction_snapshot_status(Path("site_prev/cache"), os.environ["RUN_DATE"])
          print("remote_auction_plan=", plan)
          print("remote_auction_status=", status)
          if plan["status"] == "auction_snapshot_ready_skip" or status.get("status") == "recovered":
              print("Remote valid auction or recovery snapshot already exists; skip publish.")
              raise SystemExit(10)
          PY
          }

          push_rc=1
          for attempt in 1 2 3; do
            git -C site_prev fetch origin gh-pages
            git -C site_prev reset --hard origin/gh-pages
            # 补启动可能与主会话并行；每次 push 前重新读取远端，已落地的合格快照不可被覆盖。
            set +e
            remote_auction_check
            remote_check_rc=$?
            if [ "${remote_check_rc}" -eq 10 ]; then
              exit 0
            fi
            if [ "${remote_check_rc}" -ne 0 ]; then
              exit "${remote_check_rc}"
            fi
            set -e
            RUN_DATE="${{ steps.trade.outputs.date10 }}" PYTHONPATH=. python3 - <<'PY'
          import os
          from pathlib import Path
          from daily_review.application.workflow_schedule import mark_auction_snapshot_published

          path = mark_auction_snapshot_published(
              cache_dir=Path("cache"),
              trade_date10=os.environ["RUN_DATE"],
          )
          print(f"auction_status_published_at={path}")
          PY
            mkdir -p site_prev/cache
            cp -f cache/stock_research_realtime_quotes-*.json site_prev/cache/ 2>/dev/null || true
            cp -f cache/auction_snapshot_status-*.json site_prev/cache/ 2>/dev/null || true
            cp -f cache/trade_days_cache.json site_prev/cache/ 2>/dev/null || true
            # 状态文件必须独立暂存；报价缺失时不能连 missing 状态也一起漏掉。
            git -C site_prev add -A -- cache/auction_snapshot_status-*.json
            if compgen -G "site_prev/cache/stock_research_realtime_quotes-*.json" >/dev/null; then
              git -C site_prev add -- cache/stock_research_realtime_quotes-*.json
            fi
            if [ -f site_prev/cache/trade_days_cache.json ]; then
              git -C site_prev add -- cache/trade_days_cache.json
            fi
            if git -C site_prev diff --cached --quiet; then
              echo "No auction cache changes."
              exit 0
            fi
            git -C site_prev config user.name "github-actions[bot]"
            git -C site_prev config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C site_prev commit -m "deploy: auction snapshot cache"
            if git -C site_prev push origin HEAD:gh-pages; then
              push_rc=0
              echo "changed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            push_rc=$?
            echo "Auction cache push failed on attempt ${attempt} (rc=${push_rc})"
            sleep $((attempt * 5))
          done
          exit "${push_rc}"

      - name: Trigger immediate open publish
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.trade.outputs.date10 }}
        run: |
          set -euo pipefail
          triggered_at="$(date '+%Y-%m-%d %H:%M:%S')"
          gh workflow run publish_pages.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f date10="${RUN_DATE}" \
            -f run_stage=open
          echo "open_publish_triggered_at=${triggered_at}"

      - name: Verify published auction outcome
        if: ${{ steps.trade.outputs.is_trade_today == 'true' && always() }}
        env:
          RUN_DATE: ${{ steps.trade.outputs.date10 }}
        run: |
          set -euo pipefail
          git -C site_prev fetch origin gh-pages
          git -C site_prev reset --hard origin/gh-pages
          PYTHONPATH=. python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from daily_review.application.workflow_schedule import (
              describe_auction_snapshot_status,
              resolve_auction_snapshot_prefetch_plan,
          )

          plan = resolve_auction_snapshot_prefetch_plan(Path("site_prev/cache"), os.environ["RUN_DATE"])
          status = describe_auction_snapshot_status(Path("site_prev/cache"), os.environ["RUN_DATE"])
          print("published_auction_outcome=" + json.dumps(plan, ensure_ascii=False, sort_keys=True))
          print("published_auction_status=" + json.dumps(status, ensure_ascii=False, sort_keys=True))
          if plan["status"] != "auction_snapshot_ready_skip" and status.get("status") != "recovered":
              raise SystemExit("Auction snapshot missing after the 09:25-09:30 capture window; automatic same-day recovery is also missing")
          PY
